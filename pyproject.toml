[project]
name = "a2a-server-bootcamp"
version = "0.1.0"
description = "LLM-backed synthetic LiftLine dispatch advisor over A2A"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]>=0.3.26,<0.4",
    "loguru>=0.7.3",
    "openai>=2.0.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["e2e: runs against a deployed server, needs A2A_E2E_URL"]
